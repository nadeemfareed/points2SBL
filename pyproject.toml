[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "points2sbl"
version = "0.3.0"
description = "Deep-learning wood-leaf segmentation for forest LiDAR point clouds"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "GPL-3.0-only" }
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)"
]
license-files = ["LICENSE"]
authors = [
  { name = "Nadeem Fareed" }
]
keywords = [
  "lidar",
  "point-cloud",
  "deep-learning",
  "segmentation",
  "forestry",
  "wood",
  "leaf",
  "tls",
  "uls",
  "mls",
  "pls"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: GIS"
]
dependencies = [
  "numpy>=1.23,<3",
  "scipy>=1.10,<2",
  "laspy>=2.5",
  "lazrs>=0.6",
  "torch>=2.0",
  "pyyaml>=6.0",
  "tqdm>=4.65",
  "joblib>=1.3"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "build>=1.2",
  "twine>=5.0",
  "ruff>=0.6"
]

[project.scripts]
points2sbl = "points2sbl.cli:main"

[project.urls]
Homepage = "https://github.com/nadeemfareed/points2sbl"
Repository = "https://github.com/nadeemfareed/points2sbl"
Issues = "https://github.com/nadeemfareed/points2sbl/issues"
Changelog = "https://github.com/nadeemfareed/points2sbl/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
points2sbl = ["configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
