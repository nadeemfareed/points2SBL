schema_version: 1

context:
  version: "0.3.0"

package:
  name: points2sbl
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/points2sbl/points2sbl-${{ version }}.tar.gz
  sha256: REPLACE_WITH_PYPI_SDIST_SHA256

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - pip
    - setuptools >=68
    - wheel
  run:
    - python >=3.10,<3.13
    - numpy >=1.23,<3
    - scipy >=1.10,<2
    - laspy >=2.5
    - lazrs >=0.6
    - pytorch >=2.0
    - pyyaml >=6.0
    - tqdm >=4.65
    - joblib >=1.3

tests:
  - python:
      imports:
        - points2sbl
  - script:
      - points2sbl --help
      - points2sbl model path

about:
  homepage: https://github.com/nadeemfareed/points2sbl
  repository: https://github.com/nadeemfareed/points2sbl
  license: MIT
  license_file: LICENSE
  summary: Deep-learning wood-leaf segmentation for forest LiDAR point clouds

extra:
  recipe-maintainers:
    - nadeemfareed
